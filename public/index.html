<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown转Word文档转换器</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
        background: #f5f7fa;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: #ffffff;
        border: 1px solid #e1e8ed;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        padding: 48px;
        max-width: 640px;
        width: 100%;
      }

      h1 {
        color: #1a202c;
        text-align: center;
        margin-bottom: 8px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }

      .subtitle {
        text-align: center;
        color: #718096;
        margin-bottom: 32px;
        font-size: 14px;
        font-weight: 400;
      }

      .upload-area {
        border: 2px dashed #cbd5e0;
        border-radius: 6px;
        padding: 48px 32px;
        text-align: center;
        background: #fafbfc;
        transition: all 0.2s ease;
        cursor: pointer;
        position: relative;
      }

      .upload-area:hover {
        border-color: #4299e1;
        background: #ebf8ff;
      }

      .upload-area.dragover {
        border-color: #3182ce;
        background: #bee3f8;
        border-style: solid;
      }

      .upload-icon {
        font-size: 48px;
        color: #4299e1;
        margin-bottom: 16px;
        opacity: 0.8;
      }

      .upload-text {
        color: #2d3748;
        font-size: 16px;
        margin-bottom: 8px;
        font-weight: 500;
      }

      .upload-hint {
        color: #a0aec0;
        font-size: 13px;
      }

      #fileInput {
        display: none;
      }

      .file-info {
        margin-top: 20px;
        padding: 16px;
        background: #edf2f7;
        border-radius: 6px;
        border-left: 3px solid #4299e1;
        display: none;
      }

      .file-info.show {
        display: block;
      }

      .file-name {
        color: #2d3748;
        font-weight: 500;
        margin-bottom: 4px;
        font-size: 14px;
      }

      .file-size {
        color: #718096;
        font-size: 13px;
      }

      .btn {
        width: 100%;
        padding: 12px 24px;
        margin-top: 20px;
        background: #4299e1;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        display: none;
      }

      .btn.show {
        display: block;
      }

      .btn:hover:not(:disabled) {
        background: #3182ce;
      }

      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background: #a0aec0;
      }

      .progress {
        margin-top: 20px;
        display: none;
      }

      .progress.show {
        display: block;
      }

      .progress-bar {
        width: 100%;
        height: 6px;
        background: #e2e8f0;
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: #4299e1;
        width: 0%;
        transition: width 0.3s ease;
      }

      .progress-text {
        text-align: center;
        margin-top: 8px;
        color: #718096;
        font-size: 13px;
      }

      .message {
        margin-top: 20px;
        padding: 12px 16px;
        border-radius: 6px;
        display: none;
        text-align: center;
        font-size: 14px;
      }

      .message.show {
        display: block;
      }

      .message.success {
        background: #c6f6d5;
        color: #22543d;
        border: 1px solid #9ae6b4;
      }

      .message.error {
        background: #fed7d7;
        color: #742a2a;
        border: 1px solid #fc8181;
      }

      .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Markdown转Word</h1>
      <p class="subtitle">上传Markdown文件，一键转换为Word文档</p>

      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📁</div>
        <div class="upload-text">点击或拖拽文件到此处</div>
        <div class="upload-hint">支持 .md 格式文件</div>
        <input type="file" id="fileInput" accept=".md,text/markdown" />
      </div>

      <div class="file-info" id="fileInfo">
        <div class="file-name" id="fileName"></div>
        <div class="file-size" id="fileSize"></div>
      </div>

      <button class="btn" id="convertBtn">开始转换</button>

      <div class="progress" id="progress">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="progressText">正在转换...</div>
      </div>

      <div class="message" id="message"></div>
    </div>

    <script>
      const uploadArea = document.getElementById("uploadArea");
      const fileInput = document.getElementById("fileInput");
      const fileInfo = document.getElementById("fileInfo");
      const fileName = document.getElementById("fileName");
      const fileSize = document.getElementById("fileSize");
      const convertBtn = document.getElementById("convertBtn");
      const progress = document.getElementById("progress");
      const progressFill = document.getElementById("progressFill");
      const progressText = document.getElementById("progressText");
      const message = document.getElementById("message");

      let selectedFile = null;

      // 点击上传区域
      uploadArea.addEventListener("click", () => {
        fileInput.click();
      });

      // 文件选择
      fileInput.addEventListener("change", (e) => {
        handleFile(e.target.files[0]);
      });

      // 拖拽上传：只在上传区域接收文件，避免页面其他区域吞掉 drop 事件。
      uploadArea.addEventListener("dragenter", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        uploadArea.classList.add("dragover");
      });
      uploadArea.addEventListener("dragleave", (e) => {
        if (!e.relatedTarget || !uploadArea.contains(e.relatedTarget)) {
          uploadArea.classList.remove("dragover");
        }
      });
      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        handleFile(e.dataTransfer.files[0]);
      });
      // 某些浏览器从系统文件管理器拖入时，drop 目标会落在 document；捕获阶段兜底接收。
      document.addEventListener("dragover", (e) => {
        e.preventDefault();
        if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
      }, true);
      document.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        const file = e.dataTransfer && e.dataTransfer.files[0];
        if (file) handleFile(file);
      }, true);
      // 处理文件
      function handleFile(file) {
        if (!file) return;

        // 验证文件类型
        if (!file.name.toLowerCase().endsWith(".md")) {
          showMessage("请选择Markdown文件（.md格式）", "error");
          return;
        }

        selectedFile = file;
        fileName.textContent = `文件名: ${file.name}`;
        fileSize.textContent = `大小: ${formatFileSize(file.size)}`;
        fileInfo.classList.add("show");
        convertBtn.classList.add("show");
        hideMessage();
      }

      // 格式化文件大小
      function formatFileSize(bytes) {
        if (bytes === 0) return "0 Bytes";
        const k = 1024;
        const sizes = ["Bytes", "KB", "MB", "GB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return (
          Math.round((bytes / Math.pow(k, i)) * 100) / 100 + " " + sizes[i]
        );
      }

      // 转换按钮点击
      convertBtn.addEventListener("click", async () => {
        if (!selectedFile) return;

        // 禁用按钮
        convertBtn.disabled = true;
        convertBtn.innerHTML = '<span class="loading"></span>转换中...';

        // 显示进度
        progress.classList.add("show");
        progressFill.style.width = "30%";
        progressText.textContent = "正在上传文件...";

        // 创建FormData
        const formData = new FormData();
        formData.append("markdownFile", selectedFile);

        try {
          // 发送请求
          progressFill.style.width = "60%";
          progressText.textContent = "正在转换文档...";

          const response = await fetch("/api/convert", {
            method: "POST",
            body: formData,
          });

          progressFill.style.width = "90%";
          progressText.textContent = "正在生成Word文档...";

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.error || "转换失败");
          }

          // 获取文件名（支持RFC 5987格式）
          const contentDisposition = response.headers.get(
            "Content-Disposition"
          );
          let filename = selectedFile.name.replace(/\.md$/i, ".docx");

          if (contentDisposition) {
            // 优先解析 filename* (RFC 5987格式，支持UTF-8)
            const filenameStarMatch = contentDisposition.match(
              /filename\*=UTF-8''([^;]+)/
            );
            if (filenameStarMatch && filenameStarMatch[1]) {
              try {
                filename = decodeURIComponent(filenameStarMatch[1]);
              } catch (e) {
                // 如果解码失败，尝试解析普通filename
                const filenameMatch =
                  contentDisposition.match(/filename=([^;]+)/);
                if (filenameMatch && filenameMatch[1]) {
                  const matchedFilename = filenameMatch[1].replace(/['"]/g, "");
                  filename = decodeURIComponent(matchedFilename);
                }
              }
            } else {
              // 如果没有filename*，使用filename
              const filenameMatch =
                contentDisposition.match(/filename=([^;]+)/);
              if (filenameMatch && filenameMatch[1]) {
                const matchedFilename = filenameMatch[1].replace(/['"]/g, "");
                filename = decodeURIComponent(matchedFilename);
              }
            }
          }

          // 下载文件
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);

          // 完成
          progressFill.style.width = "100%";
          progressText.textContent = "转换完成！";
          showMessage("转换成功！Word文档已开始下载", "success");

          // 重置
          setTimeout(() => {
            resetUI();
          }, 2000);
        } catch (error) {
          console.error("转换错误:", error);
          showMessage(error.message || "转换失败，请重试", "error");
          resetUI();
        }
      });

      // 显示消息
      function showMessage(text, type) {
        message.textContent = text;
        message.className = `message show ${type}`;
      }

      // 隐藏消息
      function hideMessage() {
        message.classList.remove("show");
      }

      // 重置UI
      function resetUI() {
        convertBtn.disabled = false;
        convertBtn.textContent = "开始转换";
        progress.classList.remove("show");
        progressFill.style.width = "0%";
        selectedFile = null;
        fileInput.value = "";
        fileInfo.classList.remove("show");
      }
    </script>
  </body>
</html>
